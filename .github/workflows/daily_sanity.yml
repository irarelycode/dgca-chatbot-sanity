name: Daily DGCA Sanity Check

on:
  schedule:
    # Runs every day at 10:00 AM IST (04:30 UTC)
    - cron: '30 4 * * *'
  workflow_dispatch:  # lets you run manually from the website

jobs:
  sanity-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install selenium python-docx langdetect

      - name: Install Chrome and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
          echo "CHROME_PATH=/usr/bin/chromium-browser" >> $GITHUB_ENV

      - name: Run sanity check
        env:
          CHATBOT_URL: ${{ secrets.CHATBOT_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
        run: python daily_sanity_check.py

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanity-report
          path: Sanity_Check_*.docx
